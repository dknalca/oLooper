[package]
name = "olooper"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
rodio = { version = "0.20", features = ["symphonia-aac", "symphonia-isomp4"] }
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls", "system-proxy"] }
sha2 = "0.10"
symphonia = { version = "0.5", default-features = false, features = ["aac", "isomp4"] }
wsola = "0.1"

[dev-dependencies]
