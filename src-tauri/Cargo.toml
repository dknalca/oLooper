[package]
name = "olooper"
version = "0.6.4"
edition = "2021"
rust-version = "1.87"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
id3 = "1.17"
lofty = "0.25"
midir = "0.10"
mp4ameta = "0.13"
cpal = "0.15"
rodio = { version = "0.20", features = ["symphonia-aac", "symphonia-isomp4"] }
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls-no-provider", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rusty_mp3 = "1.0.0"
sha2 = "0.10"
symphonia = { version = "0.5", default-features = false, features = ["aac", "isomp4"] }
tempfile = "3"
wsola = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26.1"
dispatch = "0.2"
objc = "0.2"

[[example]]
name = "tablist_download_test"
test = false
required-features = ["manual-tablist-probe"]

[dev-dependencies]

[features]
manual-tablist-probe = []

# Keep extracted-MP3 imports usable in dev bundles: Symphonia's decode loop is
# CPU-bound and otherwise runs in fully unoptimized debug mode.
[profile.dev.package.symphonia-bundle-mp3]
opt-level = 3

[profile.dev.package.symphonia-core]
opt-level = 3

[profile.dev.package.rodio]
opt-level = 3
